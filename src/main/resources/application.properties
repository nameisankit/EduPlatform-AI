spring.application.name=EduPlatform AI

# ─── Server ────────────────────────────────────────────────────────────────
server.port=8080

# ─── Thymeleaf ─────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html

# ─── Session ───────────────────────────────────────────────────────────────
spring.session.store-type=none
server.servlet.session.timeout=30m

# ─── Logging ───────────────────────────────────────────────────────────────
logging.level.com.eduplatform=DEBUG
logging.level.org.springframework=INFO

# ─── Pollinations Image Gen (no API key needed) ────────────────────────────
eduplatform.image.base-url=https://image.pollinations.ai/prompt/
eduplatform.image.width=800
eduplatform.image.height=450

# ─── H2 Database ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/eduplatform
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
